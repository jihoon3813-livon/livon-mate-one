<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼성화재 간병(리본케어) 서비스 인바운드 콜분석 보고서</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif !important;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-blue-600 selection:text-white pb-16">

  <!-- TOP HEADER BAR -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/90 sticky top-0 z-40 shadow-xs">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div class="flex items-center gap-3 flex-1 min-w-[260px] max-w-xl xl:max-w-2xl">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-600/20 shrink-0">
          <i data-lucide="phone-call" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded-md bg-blue-100 text-blue-800 font-black text-[10px] tracking-wide shrink-0">삼성화재 공식보고</span>
            <span class="text-[11px] text-slate-500 font-bold" id="viewerChannelLabel">인입경로: 삼성화재</span>
            <span class="text-slate-300">|</span>
            <span class="text-[11px] text-slate-400 font-mono" id="viewerSyncedAt">CTI 실시간 연동</span>
          </div>
          <h1 class="text-sm sm:text-base md:text-lg font-black text-slate-900 leading-snug mt-0.5 break-keep" id="viewerReportTitle">
            삼성화재 간병(리본케어) 서비스 인바운드 문의 분석 보고서
          </h1>
        </div>
      </div>

      <!-- 우측 액션 버튼들 (절대 줄바꿈 없이 한 줄 유지) -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-nowrap shrink-0 overflow-x-auto pb-0.5 sm:pb-0">
        <button type="button" onclick="copyReportLink()" class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl border border-blue-200 bg-blue-50/70 hover:bg-blue-100 text-blue-800 font-bold text-xs flex items-center gap-1.5 transition-all shadow-2xs cursor-pointer whitespace-nowrap shrink-0" title="현재 보고서 웹링크 복사">
          <i data-lucide="link" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-blue-600"></i>
          <span>웹링크 복사</span>
        </button>
        <button type="button" onclick="exportExcel()" class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center gap-1.5 transition-all shadow-2xs cursor-pointer whitespace-nowrap shrink-0" title="3-Sheet 정밀 엑셀 파일 다운로드">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-emerald-600"></i>
          <span>엑셀 다운로드</span>
        </button>
        <button type="button" onclick="downloadPdf()" class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-xs flex items-center gap-1.5 transition-all shadow-md shadow-blue-600/20 cursor-pointer whitespace-nowrap shrink-0" title="A4 3-시트 완본 PDF 다운로드">
          <i data-lucide="download" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white"></i>
          <span>PDF 다운로드</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 pt-6 space-y-5">

    <!-- 1. DATE FILTER & CHANNEL & SEARCH BAR -->
    <div class="bg-white rounded-3xl border border-slate-200/90 p-4 sm:p-5 shadow-xs space-y-3">
      <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
        <div class="flex items-center gap-3 flex-wrap">
          <!-- 인입경로 선택 필터 (CTI 폼과 1:1 매칭) -->
          <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-2xl p-1.5 text-xs font-bold text-slate-700">
            <i data-lucide="layers" class="w-4 h-4 text-blue-600 ml-1.5"></i>
            <span>인입경로:</span>
            <select id="reportChannelSelect" onchange="handleChannelChange(this.value)" class="bg-white px-2.5 py-1 rounded-xl border border-slate-200 font-bold text-xs text-slate-800 focus:outline-none focus:border-blue-500 cursor-pointer">
              <option value="삼성화재">삼성화재</option>
              <option value="현대해상">현대해상</option>
              <option value="리본케어">리본케어</option>
              <option value="전체">인입경로 전체</option>
            </select>
          </div>

          <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-2xl p-1.5 text-xs font-bold text-slate-700">
            <i data-lucide="calendar" class="w-4 h-4 text-slate-500 ml-1.5"></i>
            <span>조회기간:</span>
            <input type="date" id="reportStartDate" class="bg-white px-2.5 py-1 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none focus:border-blue-500">
            <span>~</span>
            <input type="date" id="reportEndDate" class="bg-white px-2.5 py-1 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none focus:border-blue-500">
            <button type="button" onclick="applyDateRange()" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all shadow-2xs cursor-pointer">
              조회
            </button>
          </div>

          <div class="flex items-center gap-1 flex-wrap">
            <button type="button" onclick="setPresetRange('today')" class="px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold text-xs transition-colors cursor-pointer">오늘</button>
            <button type="button" onclick="setPresetRange('yesterday')" class="px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold text-xs transition-colors cursor-pointer">어제</button>
            <button type="button" onclick="setPresetRange('thisWeek')" class="px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold text-xs transition-colors cursor-pointer">이번 주</button>
            <button type="button" onclick="setPresetRange('lastWeek')" class="px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold text-xs transition-colors cursor-pointer">지난 주</button>
            <button type="button" onclick="setPresetRange('last30')" class="px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold text-xs transition-colors cursor-pointer">최근 30일</button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <div class="relative w-full sm:w-72">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
            <input type="text" id="globalSearchInput" oninput="handleSearch(this.value)" placeholder="전화번호, 환자명, 키워드, 제목 검색..." class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50/70 focus:bg-white focus:outline-none focus:border-blue-500 font-medium">
          </div>
          <button type="button" onclick="syncLiveCti()" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold text-xs flex items-center gap-1.5 transition-all shadow-xs shrink-0 cursor-pointer" title="GoodARS CTI 실시간 최신 통화데이터 즉시 동기화">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="syncIcon"></i>
            <span>CTI 동기화</span>
          </button>
        </div>
      </div>

      <!-- CTI 원본 공식 집계 요약 스트립 (CTI 웹 화면과 100% 일치) -->
      <div id="ctiSummaryStrip" class="hidden"></div>
    </div>

    <!-- 2. SUB-TAB SWITCHER -->
    <div class="flex items-center justify-between border-b border-slate-200 gap-2 px-1">
      <div class="flex items-center space-x-1 sm:space-x-2 overflow-x-auto whitespace-nowrap py-1 scrollbar-none -mb-px">
        <button type="button" onclick="switchTab('summary')" id="tabBtn-summary" class="px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-t-xl text-xs sm:text-sm font-black flex items-center gap-1.5 border-b-2 border-blue-600 text-blue-700 bg-white shadow-2xs transition-all cursor-pointer whitespace-nowrap shrink-0">
          <i data-lucide="pie-chart" class="w-4 h-4"></i>
          <span>분석 요약</span>
          <span class="px-1.5 py-0.5 rounded-full text-[10px] bg-blue-100 text-blue-800">핵심</span>
        </button>
        <button type="button" onclick="switchTab('daily')" id="tabBtn-daily" class="px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-t-xl text-xs sm:text-sm font-black flex items-center gap-1.5 border-b-2 border-transparent text-slate-500 hover:text-slate-900 hover:bg-slate-100/60 transition-all cursor-pointer whitespace-nowrap shrink-0">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
          <span>일자별 인입현황</span>
        </button>
        <button type="button" onclick="switchTab('logs')" id="tabBtn-logs" class="px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-t-xl text-xs sm:text-sm font-black flex items-center gap-1.5 border-b-2 border-transparent text-slate-500 hover:text-slate-900 hover:bg-slate-100/60 transition-all cursor-pointer whitespace-nowrap shrink-0">
          <i data-lucide="list-filter" class="w-4 h-4"></i>
          <span>통화로그(원본)</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] bg-amber-100 text-amber-900 font-bold border border-amber-300 whitespace-nowrap inline-flex items-center">2개 컬럼 연동</span>
        </button>
      </div>

      <div id="filterTagContainer" class="flex items-center gap-2 pb-1 text-xs shrink-0"></div>
    </div>

    <!-- 3. TAB CONTENT CONTAINERS -->
    <div id="tabContent-summary" class="space-y-6"></div>
    <div id="tabContent-daily" class="space-y-6 hidden"></div>
    <div id="tabContent-logs" class="space-y-4 hidden"></div>

  </main>

  <script>
    let gReportData = null;
    let gActiveTab = 'summary';
    let isSyncing = false;
    let gFilter = {
      category: '',
      actor: '',
      search: '',
      channel: '삼성화재',
      consultedOnly: true,
      startDate: '2026-08-18',
      endDate: new Date().toISOString().slice(0, 10)
    };
    let gDailyChartInstance = null;

    // 전화번호 -> 회원명 매핑 데이터 (중복 등록 지원)
    const gMemberPhoneMap = {
      "01082034022": ["김진선"],
      "01046322336": ["심윤주"],
      "01036523111": ["이정옥"],
      "01027558701": ["이춘자"],
      "01075741088": ["차정옥"],
      "01064740035": ["김순년"],
      "01091117027": ["성정주"],
      "01045901016": ["김미영"],
      "01073803605": ["이윤진"],
      "01088055669": ["류미선"],
      "01064905503": ["고처자"],
      "01080062268": ["엄정현"],
      "01071878718": ["이성근"],
      "01087318863": ["오채은"],
      "01024732079": ["박지원"],
      "01038757912": ["김옥경"],
      "01090606723": ["김미영"],
      "01086365285": ["성정주"],
      "01084408025": ["김순년"],
      "01035798090": ["차정옥"],
      "01026852721": ["이춘자"],
      "01086451345": ["심윤주"],
      "01051801529": ["김진선"],
      "01056320022": ["김진선"],
      "01051933507": ["김진선"],
      "01068614997": ["김옥경"],
      "01053427053": ["박지원", "이윤진"],
      "01067189923": ["박영호"],
      "01091234567": ["강태우"],
      "01082345678": ["윤서진"],
      "01073456789": ["최동훈"]
    };

    function formatPhoneNumber(phone) {
      if (!phone) return '-';
      const clean = String(phone).replace(/[^0-9]/g, '');
      if (clean.length === 11) {
        return clean.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
      } else if (clean.length === 10) {
        if (clean.startsWith('02')) {
          return clean.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
        }
        return clean.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
      } else if (clean.length === 9 && clean.startsWith('02')) {
        return clean.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
      } else if (clean.length === 8) {
        return clean.replace(/(\d{4})(\d{4})/, '$1-$2');
      }
      return phone;
    }

    function resolveMemberName(phone, ctiMemberName) {
      const clean = String(phone || '').replace(/[^0-9]/g, '');
      if (gMemberPhoneMap[clean] && gMemberPhoneMap[clean].length > 0) {
        return gMemberPhoneMap[clean].join(', ');
      }
      if (ctiMemberName && ctiMemberName !== '비회원' && ctiMemberName !== '회원아님') {
        return ctiMemberName;
      }
      return '비회원';
    }

    const SAMSUNG_CATEGORIES = [
      { name: '보험 문의·타업무 연결', barClass: 'bg-amber-500', description: '리본케어=보험가입 기관 아님→삼성화재(1588-5114) 이관, 보험금 청구·보장 문의, 담당자 연결' },
      { name: '이용방식(24시간·교체·산정)', barClass: 'bg-indigo-500', description: '24시간 상주·동일간병인, 간병인 교체(2회 제한), 1일 산정(8시간·1박2일), 대체인력' },
      { name: '간병 신청·접수·배정', barClass: 'bg-sky-500', description: '본인·보호자 확인/대리신청, 랜덤 배정, 24시간 내 배정, 응급·주말·명절 접수, 재접수' },
      { name: '협력업체 등록·지역연계', barClass: 'bg-cyan-500', description: '간병업체 파트너 등록·MOU, 지역 지부 연계·파견·일당' },
      { name: '비용·무상제공 확인', barClass: 'bg-rose-500', description: '180일 무상 현물제공, 추가비용·수당 없음 재확인, 미제공시 실비지원' },
      { name: '간병인(요양보호사) 등록', barClass: 'bg-teal-500', description: '요양보호사·간병사 개인/가족 등록, 자격증 요건, 근무지역' },
      { name: '서비스 이용조건·범위', barClass: 'bg-emerald-500', description: '이용대상(가입 필수·지정불가), 질병범위(경증 가능·중환자실/전염병 제외), 가족간병 불가' },
      { name: '제휴·영업지원 확인', barClass: 'bg-slate-500', description: '리본케어 서비스 정체 확인, 설계사 판매·홍보 자료 요청' }
    ];

    const SAMSUNG_ACTORS = [
      { name: '고객(가입자·이용자)', barClass: 'bg-blue-600', description: '실사용·가입 고객의 신청·접수 및 서비스 이해 문의' },
      { name: '협력업체·간병협회', barClass: 'bg-purple-600', description: '간병업체·협회의 파트너 등록·지역 연계 문의(공급망)' },
      { name: '간병인 등록희망자', barClass: 'bg-emerald-600', description: '요양보호사 등 간병 인력의 등록·자격 문의(공급 확충)' },
      { name: '삼성화재 내부(설계사·지점)', barClass: 'bg-amber-600', description: '판매채널(설계사·지점)의 상품설명·규정 확인(교육/자료)' }
    ];

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('start')) gFilter.startDate = urlParams.get('start');
      if (urlParams.get('end')) gFilter.endDate = urlParams.get('end');
      if (urlParams.get('channel')) gFilter.channel = urlParams.get('channel');

      document.getElementById('reportStartDate').value = gFilter.startDate;
      document.getElementById('reportEndDate').value = gFilter.endDate;
      const chSelect = document.getElementById('reportChannelSelect');
      if (chSelect) chSelect.value = gFilter.channel;

      await loadReportData();
    });

    async function handleChannelChange(ch) {
      gFilter.channel = ch;
      const url = new URL(window.location.href);
      url.searchParams.set('channel', ch);
      window.history.replaceState({}, '', url);
      await syncLiveCti();
    }

    async function loadReportData() {
      try {
        const res = await fetch('/api/samsung/call-report/data');
        const json = await res.json();
        if (json.success && json.data) {
          // If server data matches requested channel/dates, use it; otherwise sync
          const info = json.data.reportInfo || {};
          if (info.channel === gFilter.channel && info.startDate === gFilter.startDate && info.endDate === gFilter.endDate) {
            gReportData = json.data;
            renderAll();
          } else {
            await syncLiveCti();
          }
        } else {
          await syncLiveCti();
        }
      } catch (err) {
        console.error('Error loading report:', err);
      }
    }

    function renderAll() {
      if (!gReportData) return;
      const stats = calculateStats();
      renderSummarySheet(stats);
      renderDailySheet(stats);
      renderLogsSheet(stats);
      renderFilterTags();
      renderCtiSummaryStrip();
      if (window.lucide) lucide.createIcons();

      if (gActiveTab === 'daily') {
        renderDailyTrendChart();
      }
    }

    function renderCtiSummaryStrip() {
      const container = document.getElementById('ctiSummaryStrip');
      if (!container || !gReportData || !gReportData.ctiSummary) return;

      const cs = gReportData.ctiSummary;
      const info = gReportData.reportInfo || {};

      container.className = 'bg-gradient-to-r from-blue-50/80 to-indigo-50/50 border border-blue-200/70 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-3 flex-wrap text-xs';
      container.innerHTML = `
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded-md bg-blue-600 text-white font-black text-[10px] tracking-wide">CTI 원본 집계</span>
          <span class="text-slate-700 font-bold">“${info.startDate || gFilter.startDate} 부터 ${info.endDate || gFilter.endDate}” <span class="text-blue-700">[${info.channelLabel || info.channel || gFilter.channel}]</span> 검색 결과:</span>
        </div>
        <div class="flex items-center gap-2.5 sm:gap-3.5 text-slate-700 font-semibold flex-wrap text-[11px]">
          <span>전체: <b class="text-blue-700 font-black">${cs.totalInbound}건</b></span>
          <span class="text-slate-300">|</span>
          <span>인입콜: <b class="text-slate-900 font-bold">${cs.totalInbound}/${cs.answeredCalls}건</b></span>
          <span class="text-slate-300">|</span>

    function calculateStats() {
      const logs = (gReportData && gReportData.callLogs) || [];
      const totalCalls = logs.length;
      const connectReqCalls = logs.filter(c => c.connectReq === 'Y' || (c.arsMenu || '').includes('상담연결')).length;
      const consultedCalls = logs.filter(c => c.title || c.summary || (c.duration && c.duration !== '0'));
      const consultedCount = consultedCalls.length;
      const connectRate = totalCalls > 0 ? Math.round((connectReqCalls / totalCalls) * 100) : 0;
      const opDays = (gReportData.dailyTrends || []).length || 25;
      const dailyAvg = opDays > 0 ? Math.round(totalCalls / opDays) : 0;

      const catMap = {};
      SAMSUNG_CATEGORIES.forEach(c => catMap[c.name] = 0);
      consultedCalls.forEach(c => {
        if (c.category) catMap[c.category] = (catMap[c.category] || 0) + 1;
      });
      const catList = SAMSUNG_CATEGORIES.map(c => {
        const count = catMap[c.name] || 0;
        const share = consultedCount > 0 ? count / consultedCount : 0;
        return { ...c, count, share, pct: (share * 100).toFixed(1) };
      }).sort((a, b) => b.count - a.count);

      const actorMap = {};
      SAMSUNG_ACTORS.forEach(a => actorMap[a.name] = 0);
      consultedCalls.forEach(c => {
        if (c.actor) actorMap[c.actor] = (actorMap[c.actor] || 0) + 1;
      });
      const actorList = SAMSUNG_ACTORS.map(a => {
        const count = actorMap[a.name] || 0;
        const share = consultedCount > 0 ? count / consultedCount : 0;
        return { ...a, count, share, pct: (share * 100).toFixed(1) };
      }).sort((a, b) => b.count - a.count);

      return { totalCalls, connectReqCalls, connectRate, consultedCount, opDays, dailyAvg, catList, actorList };
    }

    function renderDailyTrendChart() {

      const labels = trends.map(t => `${t.date.slice(5)} (${t.dayOfWeek})`);

      const backgroundColors = trends.map(t => {
        if (t.dayOfWeek === '토' || t.dayOfWeek === '일') return 'rgba(203, 213, 225, 0.8)';
        if (t.callCount >= 25) return 'rgba(29, 78, 216, 0.9)';
        return 'rgba(56, 189, 248, 0.85)';
      });

      if (gDailyChartInstance) {
        gDailyChartInstance.destroy();

      const ctx = canvas.getContext('2d');
      gDailyChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{

            data,
            backgroundColor: backgroundColors,
            borderRadius: 6,
            borderSkipped: false
          }]

        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {

    function setPresetRange(type) {
      const today = new Date();
      let start = new Date();
      let end = new Date();

      if (type === 'today') {
      } else if (type === 'yesterday') {
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
      } else if (type === 'thisWeek') {
        const day = today.getDay();
        const diff = today.getDate() - day + (day === 0 ? -6 : 1);
        start.setDate(diff);
      } else if (type === 'lastWeek') {
        const day = today.getDay();
        const diff = today.getDate() - day + (day === 0 ? -6 : 1) - 7;
        start.setDate(diff);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
      } else if (type === 'last30') {
        start.setDate(today.getDate() - 30);
      }

      gFilter.startDate = start.toISOString().slice(0, 10);
      gFilter.endDate = end.toISOString().slice(0, 10);
      document.getElementById('reportStartDate').value = gFilter.startDate;
      document.getElementById('reportEndDate').value = gFilter.endDate;

      applyDateRange();
    }

    async function applyDateRange() {
      const s = document.getElementById('reportStartDate').value;
      const e = document.getElementById('reportEndDate').value;
      if (!s || !e) return;
      gFilter.startDate = s;
      gFilter.endDate = e;

      const url = new URL(window.location);
      url.searchParams.set('start', s);
      url.searchParams.set('end', e);
      window.history.replaceState({}, '', url);

      await syncLiveCti();
    }

    async function syncLiveCti() {
      if (isSyncing) return;
      isSyncing = true;
      const icon = document.getElementById('syncIcon');
      if (icon) icon.classList.add('animate-spin');

      const ch = document.getElementById('reportChannelSelect')?.value || gFilter.channel || '삼성화재';
      gFilter.channel = ch;

      try {
        const res = await fetch(`/api/samsung/call-report/sync-cti?start=${gFilter.startDate}&end=${gFilter.endDate}&channel=${encodeURIComponent(ch)}`);
        const json = await res.json();
        if (json.success && json.data) {
          gReportData = json.data;
          const label = document.getElementById('viewerChannelLabel');
          if (label) label.innerText = `인입경로: ${gReportData.reportInfo.channelLabel || ch}`;
          const title = document.getElementById('viewerReportTitle');
          if (title) title.innerText = gReportData.reportInfo.title || '삼성화재 간병(리본케어) 서비스 인바운드 문의 분석 보고서';
          document.getElementById('viewerSyncedAt').innerText = `CTI 동기화: ${new Date().toLocaleTimeString('ko-KR')}`;
          renderAll();
        } else {
          alert('CTI 동기화 중 오류: ' + (json.error || ''));
        }
      } catch (err) {
        alert('서버 통신 오류: ' + err.message);
      } finally {
        isSyncing = false;
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    function copyReportLink() {
      const s = gFilter.startDate;
      const e = gFilter.endDate;
      const ch = gFilter.channel || '삼성화재';
      const origin = window.location.origin;
      const pathname = window.location.pathname;
      const reportUrl = `${origin}${pathname}?start=${s}&end=${e}&channel=${encodeURIComponent(ch)}`;

      navigator.clipboard.writeText(reportUrl).then(() => {
        alert(`[보고서 공유 링크가 복사되었습니다]\n\n${reportUrl}\n\n삼성화재 담당자 및 협력사에 전달하여 웹에서 즉시 열람하실 수 있습니다.`);
      }).catch(() => {
        prompt('아래 링크를 복사하여 전달해주세요:', reportUrl);
      });
    }

        { header: '인입채널', key: 'channel', width: 14 },
        { header: '전화번호', key: 'phone', width: 18 },
        { header: '회원이름', key: 'member', width: 16 },
        { header: 'ARS메뉴', key: 'ars', width: 16 },
        { header: '연결요청', key: 'connect', width: 12 },
        { header: '대기시간', key: 'wait', width: 12 },
        { header: '문의 대분류 (신규) ✨', key: 'cat', width: 26 },
        { header: '문의 주체 (신규) ✨', key: 'act', width: 24 },
        { header: '상담제목', key: 'title', width: 28 },
        { header: '상담요약 (전문의 내용)', key: 'summary', width: 55 },
        { header: '키워드', key: 'keywords', width: 28 },
        { header: '통화시간', key: 'dur', width: 12 }
      ];

      const logHead = ws3.getRow(1);
      logHead.height = 24;
      logHead.eachCell((c, colNum) => {
        if (colNum === 9 || colNum === 10) {
          c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1D4ED8' } };
          c.font = { color: { argb: 'FFFEF08A' }, bold: true };
        } else {
          c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
          c.font = { color: { argb: 'FFFFFFFF' }, bold: true };
        }
        c.alignment = { horizontal: 'center', vertical: 'middle' };
      });

      (gReportData.callLogs || []).forEach((c, idx) => {
        const formattedPhone = formatPhoneNumber(c.phone || c.rawPhone);
        const resolvedName = resolveMemberName(c.phone || c.rawPhone, c.memberName);
        const r = ws3.addRow({
          no: idx + 1,
          time: c.callTime,
          channel: c.channel || '삼성화재',
          phone: formattedPhone,
          member: resolvedName,
          ars: c.arsMenu,
          connect: c.connectReq,
          wait: c.waitTime ? `${c.waitTime}초` : '0',
          cat: c.category,
          act: c.actor,
          title: c.title,
          summary: c.summary,
          keywords: c.keywords,
          dur: c.duration
        });
        r.eachCell(cell => cell.border = thinBorder);
        if (idx % 2 === 1) {
          r.eachCell((cell, col) => {
            if (col !== 9 && col !== 10) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          });
        }
        r.getCell(1).alignment = { horizontal: 'center' };
        r.getCell(4).alignment = { horizontal: 'center' };
        r.getCell(5).alignment = { horizontal: 'center' };
        r.getCell(7).alignment = { horizontal: 'center' };
        r.getCell(8).alignment = { horizontal: 'center' };
        r.getCell(9).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0F2FE' } };
        r.getCell(10).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0E7FF' } };
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const chLabel = gReportData.reportInfo.channelLabel || gFilter.channel || '삼성화재';
      a.download = `삼성화재_간병콜분석_${chLabel}_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function setPdfProgress(stepText, percent) {
      const modal = document.getElementById('pdfProgressModal');
      if (!modal) return;
      modal.classList.remove('hidden');
      const bar = document.getElementById('pdfProgressBar');
      if (bar) bar.style.width = `${percent}%`;
      const stepEl = document.getElementById('pdfProgressStepText');
      if (stepEl) stepEl.innerText = stepText;
      const pctEl = document.getElementById('pdfProgressPercent');
      if (pctEl) pctEl.innerText = `${percent}%`;
    }

    function hidePdfProgress() {
      const modal = document.getElementById('pdfProgressModal');
      if (modal) {
        setTimeout(() => modal.classList.add('hidden'), 600);
      }
    }

    async function downloadPdf() {
      if (!gReportData) return;
      try {
        setPdfProgress('1/4 보고서 데이터 및 차트 집계 중...', 25);
        await new Promise(r => setTimeout(r, 200));

        const stats = calculateStats();
        const info = gReportData.reportInfo || {};
        const trends = gReportData.dailyTrends || [];
        const consultedLogs = (gReportData.callLogs || []).filter(c => c.title || c.summary);

        setPdfProgress('2/4 A4 3-시트 완본 레이아웃 구성 중...', 55);
        await new Promise(r => setTimeout(r, 200));

        const html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <style>
            @page { size: A4 portrait; margin: 15mm 12mm; }
            body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; font-size: 9pt; color: #1e293b; line-height: 1.4; margin: 0; padding: 0; }
            .page-break { page-break-before: always; }
            .header { border-bottom: 3px solid #1d4ed8; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; }
            .title { font-size: 16pt; font-weight: bold; color: #0f172a; margin: 0; }
            .sub { font-size: 8.5pt; color: #64748b; margin-top: 4px; }
            .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
            .kpi-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; text-align: center; }
            .kpi-num { font-size: 14pt; font-weight: bold; color: #1e3a8a; margin: 2px 0; }
            .box-title { font-size: 10pt; font-weight: bold; color: #0f172a; margin-bottom: 6px; border-left: 3px solid #2563eb; padding-left: 6px; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 8pt; }
            th, td { border: 1px solid #cbd5e1; padding: 5px 6px; }
            th { background: #f1f5f9; font-weight: bold; text-align: left; }
            .text-center { text-align: center; }
            .text-right { text-align: right; }
            .font-mono { font-family: Consolas, monospace; }
          </style>
        </head>
        <body>
          <!-- SHEET 1: SUMMARY -->
          <div class="header">
            <div>
              <div style="font-size: 8pt; font-weight: bold; color: #2563eb; margin-bottom: 2px;">삼성화재 주간/수시 공식 보고서 (시트 1: 분석 요약)</div>
              <h1 class="title">${info.title}</h1>
              <div class="sub">분석기간: <b>${info.period}</b> | 보고일자: <b>${info.reportDate}</b> | 작성: <b>${info.author}</b></div>
            </div>
            <div style="text-align: right; font-weight: bold; color: #1d4ed8; font-size: 12pt;">Livon Care</div>
          </div>

          <div class="kpi-grid">
            <div class="kpi-box">
              <div style="font-size: 8pt; color: #64748b;">총 인입콜</div>
              <div class="kpi-num">${stats.totalCalls}건</div>
              <div style="font-size: 7.5pt; color: #94a3b8;">인바운드 총량</div>
            </div>
            <div class="kpi-box">
              <div style="font-size: 8pt; color: #64748b;">상담연결 요청</div>
              <div class="kpi-num">${stats.connectReqCalls}건</div>
              <div style="font-size: 7.5pt; color: #2563eb;">연결률 ${stats.connectRate}%</div>
            </div>
            <div class="kpi-box" style="background: #eff6ff; border-color: #bfdbfe;">
              <div style="font-size: 8pt; color: #1d4ed8; font-weight: bold;">실제 상담(분석)</div>
              <div class="kpi-num" style="color: #1e3a8a;">${stats.consultedCount}건</div>
              <div style="font-size: 7.5pt; color: #1d4ed8;">전수 1:1 분석</div>
            </div>
            <div class="kpi-box">
              <div style="font-size: 8pt; color: #64748b;">일평균 인입</div>
              <div class="kpi-num">${stats.dailyAvg}건</div>
              <div style="font-size: 7.5pt; color: #94a3b8;">운영일 ${stats.opDays}일</div>
            </div>
          </div>

          <div class="box-title">1. 주요 문의유형 분포 (대분류 8종 집계)</div>
          <table>
            <thead>
              <tr style="background: #1e40af; color: white;">
                <th style="width: 25%;">문의 대분류</th>
                <th style="width: 12%; text-align: right;">건수</th>
                <th style="width: 12%; text-align: right;">비중</th>
                <th>대표 내용</th>
              </tr>
            </thead>
            <tbody>
              ${stats.catList.map(c => `
                <tr>
                  <td><b>${c.name}</b></td>
                  <td class="text-right font-mono">${c.count}건</td>
                  <td class="text-right font-mono">${c.pct}%</td>
                  <td style="color: #475569; font-size: 7.5pt;">${c.description}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="box-title">2. 문의 주체별 분포 (4종)</div>
          <table>
            <thead>
              <tr style="background: #334155; color: white;">
                <th style="width: 25%;">문의 주체</th>
                <th style="width: 12%; text-align: right;">건수</th>
                <th style="width: 12%; text-align: right;">비중</th>
                <th>성격 및 목적</th>
              </tr>
            </thead>
            <tbody>
              ${stats.actorList.map(a => `
                <tr>
                  <td><b>${a.name}</b></td>
                  <td class="text-right font-mono">${a.count}건</td>
                  <td class="text-right font-mono">${a.pct}%</td>
                  <td style="color: #475569; font-size: 7.5pt;">${a.description}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <!-- SHEET 2: DAILY -->
          <div class="page-break"></div>
          <div class="header">
            <div>
              <div style="font-size: 8pt; font-weight: bold; color: #2563eb;">삼성화재 주간/수시 공식 보고서 (시트 2: 일자별 인입현황)</div>
              <h1 class="title">일자별 콜 인입 추이 및 요일별 집계</h1>
            </div>
            <div style="text-align: right; font-weight: bold; color: #1d4ed8; font-size: 12pt;">Livon Care</div>
          </div>

          <div class="box-title">일자별 전수 인입 내역 (${trends.length}일)</div>
          <table>
            <thead>
              <tr style="background: #0f172a; color: white;">
                <th style="width: 20%;">일자</th>
                <th style="width: 15%;" class="text-center">요일</th>
                <th style="width: 20%;" class="text-right">인입콜(건)</th>
                <th style="width: 20%;" class="text-right">점유 비중</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              ${trends.map(t => `
                <tr ${t.dayOfWeek === '토' || t.dayOfWeek === '일' ? 'style="background: #f8fafc;"' : ''}>
                  <td class="font-mono"><b>${t.date}</b></td>
                  <td class="text-center font-mono">${t.dayOfWeek}</td>
                  <td class="text-right font-mono font-bold">${t.callCount}건</td>
                  <td class="text-right font-mono">${(t.share * 100).toFixed(1)}%</td>
                  <td style="color: #64748b;">${t.note || '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <!-- SHEET 3: LOGS -->
          <div class="page-break"></div>
          <div class="header">
            <div>
              <div style="font-size: 8pt; font-weight: bold; color: #2563eb;">삼성화재 주간/수시 공식 보고서 (시트 3: 통화로그 원본)</div>
              <h1 class="title">통화로그 전수 원본 및 신규 컬럼 1:1 연동표</h1>
            </div>
            <div style="text-align: right; font-weight: bold; color: #1d4ed8; font-size: 12pt;">Livon Care</div>
          </div>

          <div class="box-title">실제 상담 인바운드 콜 전수 로그 (${consultedLogs.length}건)</div>
          <table>
            <thead>
              <tr style="background: #1e293b; color: white;">
                <th style="width: 10%;">일시</th>
                <th style="width: 12%;">전화번호</th>
                <th style="width: 10%;">회원이름</th>
                <th style="width: 15%; background: #1d4ed8; color: #fef08a;">문의 대분류 ✨</th>
                <th style="width: 13%; background: #1d4ed8; color: #fef08a;">문의 주체 ✨</th>
                <th style="width: 16%;">상담제목</th>
                <th>상담요약 (전문의 내용)</th>
              </tr>
            </thead>
            <tbody>
              ${consultedLogs.map(c => {
                const fPhone = formatPhoneNumber(c.phone || c.rawPhone);
                const mName = resolveMemberName(c.phone || c.rawPhone, c.memberName);
                return `
                <tr>
                  <td class="font-mono" style="font-size: 7pt;">${(c.callTime || '').slice(5)}</td>
                  <td class="font-mono font-bold">${fPhone}</td>
                  <td style="font-weight: bold; color: #1e40af;">${mName}</td>
                  <td style="font-weight: bold; color: #1e40af;">${c.category}</td>
                  <td style="font-weight: bold; color: #4338ca;">${c.actor}</td>
                  <td><b>${c.title}</b></td>
                  <td style="font-size: 7pt; color: #334155; line-height: 1.3;">${c.summary}</td>
                </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </body>
        </html>
      `;

        setPdfProgress('3/4 서버 PDF 고화질 렌더링 중...', 80);
        const res = await fetch('/api/samsung/call-report/pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            htmlContent: html,
            title: `삼성화재_간병서비스_콜분석_${info.period || '보고서'}`
          })
        });

        if (!res.ok) throw new Error('PDF 생성 서버 에러');
        setPdfProgress('4/4 PDF 파일 다운로드 중...', 95);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `삼성화재_간병서비스_콜분석_보고서.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setPdfProgress('완료되었습니다!', 100);
      } catch (e) {
        alert('PDF 다운로드 실패: ' + e.message);
      } finally {
        hidePdfProgress();
      }
    }
  </script>

  <!-- PDF 다운로드 진행 상태 모달 -->
  <div id="pdfProgressModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 text-center animate-in fade-in zoom-in duration-200">
      <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
        <svg class="w-7 h-7 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
      </div>
      <h3 class="text-base font-bold text-slate-800 mb-1">고화질 PDF 보고서 생성 중</h3>
      <p id="pdfProgressStepText" class="text-xs text-slate-500 mb-4">보고서 데이터 집계 중...</p>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden mb-2">
        <div id="pdfProgressBar" class="bg-gradient-to-r from-blue-600 to-indigo-600 h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 10%"></div>
      </div>
      <div class="flex justify-between items-center text-[11px] text-slate-400 font-mono">
        <span>A4 3-시트 완본</span>
        <span id="pdfProgressPercent" class="font-bold text-blue-600">10%</span>
      </div>
    </div>
  </div>
</body>
</html>
