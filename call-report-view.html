  <script>
    function getThisWeekRange() {
      const now = new Date();
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);
      const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday + 6);
      const pad = n => String(n).padStart(2, '0');
      const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const todayStr = fmt(now);
      const sundayStr = fmt(sunday);
      // 미래 날짜는 제외하고 오늘까지로 캡핑
      const endStr = sundayStr > todayStr ? todayStr : sundayStr;
      return { start: fmt(monday), end: endStr };
    }

function formatPhoneNumber(num) {
  if (!num) return '-';
  const raw = String(num).replace(/[^0-9]/g, '');
  if (raw.length === 11) {
    return raw.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  }
  if (raw.length === 10) {
    if (raw.startsWith('02')) {
      return raw.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
    }
    return raw.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  }
  if (raw.length === 9 && raw.startsWith('02')) {
    return raw.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
  }
  if (raw.length === 8) {
    return raw.replace(/(\d{4})(\d{4})/, '$1-$2');
  }
  return num;
}

function resolveMemberName(rawPhone, fallbackName, title = '', summary = '') {
  if (!rawPhone && !fallbackName && !title && !summary) return '비회원';
  const clean = String(rawPhone || '').replace(/[^0-9]/g, '');
  if (clean && gMemberPhoneMap[clean] && gMemberPhoneMap[clean].length > 0) {
    return gMemberPhoneMap[clean].join(', ');
  }
  if (fallbackName && fallbackName !== '회원아님' && fallbackName !== '비회원' && fallbackName !== '-') {
    return fallbackName;
  }
  // 상담 제목 및 요약문 스마트 고객명 자동 감지
  if (title || summary) {
    const t = String(title || '');
    const s = String(summary || '');
    const m1 = t.match(/^([가-힣]{2,4})(?:님|님의| 환자|의|,| 고객)/);
    if (m1) {
      const cand = m1[1];
      const exclude = ['간병', '상담', '입원', '보험', '수술', '삼성', '리본', '요양', '응급', '추석', '순천', '어린', '방문', '진심', '감염', '여수'];
      if (!exclude.some(x => cand.includes(x))) return cand;
    }
    const m2 = s.match(/([가-힣]{2,4})\s*씨의\s*(?:긴급한|간병|요청|입원|수술)/);
    if (m2) return m2[1];
    const m3 = s.match(/계약자\s*['"‘“]([가-힣]{2,4})['"’”]/);
    if (m3) return m3[1];
  }
  return '비회원';
}

    async function loadReportData() {
      try {
        updateBranding();
        updatePresetButtons();
        let loaded = false;

        // 1. 세션 스토리지 캐시 확인 (0ms)
        try {
          const cached = sessionStorage.getItem('LIVON_CACHED_ALL_REPORT_DATA') || sessionStorage.getItem('LIVON_CACHED_SAMSUNG_REPORT_DATA');
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && parsed.callLogs && parsed.callLogs.length >= 200) {
              gReportData = parsed;
              loaded = true;
              renderAll();
            }
          }
        } catch (e) {}

        // 2. 전체 및 채널별 정적 데이터 파일 우선 고속 로드 (5ms)
        const primaryFiles = [
          `/call_report_all.json?t=${Date.now()}`,
          `./call_report_all.json?t=${Date.now()}`,
          `call_report_all.json?t=${Date.now()}`,
          (gFilter.channel === '현대해상') ? `/call_report_hyundai.json?t=${Date.now()}` : null,
          (gFilter.channel === '리본케어') ? `/call_report_livon.json?t=${Date.now()}` : null,
          `/call_report_samsung.json?t=${Date.now()}`,
          `./call_report_samsung.json?t=${Date.now()}`,
          `call_report_samsung.json?t=${Date.now()}`
        ].filter(Boolean);

        for (const u of primaryFiles) {
          try {
            const res = await fetch(u);
            if (res.ok) {
              const cType = res.headers.get('content-type') || '';
              if (cType.includes('json') || !cType.includes('html')) {
                const json = await res.json();
                const data = (json && json.data) ? json.data : json;
                if (data && data.callLogs && data.callLogs.length > 0) {
                  gReportData = data;
                  loaded = true;
                  try {
                    const cacheKey = isHyundai ? 'LIVON_CACHED_ALL_REPORT_DATA' : 'LIVON_CACHED_SAMSUNG_REPORT_DATA';
                    sessionStorage.setItem(cacheKey, JSON.stringify(data));
                  } catch (e) {}
                  break;
                }
              }
            }
          } catch (e) {}
        }

        // 3. API 엔드포인트 fallback
        if (!loaded) {
          try {
            const res = await fetch('/api/samsung/call-report/data?channel=' + encodeURIComponent(gFilter.channel));
            if (res.ok) {
              const json = await res.json();
              if (json.success && json.data) {
                gReportData = json.data;
                loaded = true;
              }
            }
          } catch (e) {}
        }

        if (loaded && gReportData) {
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get('start')) gFilter.startDate = urlParams.get('start');
          if (urlParams.get('end')) gFilter.endDate = urlParams.get('end');
          const sEl = document.getElementById('reportStartDate');
          if (sEl) sEl.value = gFilter.startDate;
          const eEl = document.getElementById('reportEndDate');
          if (eEl) eEl.value = gFilter.endDate;
          updateBranding();
          updatePresetButtons();
          renderAll();
        } else {
          await syncLiveCti();
        }
      } catch (err) {
        console.error('Error loading report:', err);
      }
    }

    function renderCtiSummaryStrip() {
      // 링크페이지에서는 CTI 집계 카드를 노출하지 않음
      return;
    }

    function calculateStats() {
      let logs = ((gReportData && gReportData.callLogs) || []).filter(c => c.connectReq === 'Y' || c.connectReq === true || String(c.connectReq).toUpperCase() === 'Y');
      // 엄격한 보험사 채널 격리: 해당 보험사 고객만 100% 필터링 (타 보험사 완전 배제)
      const targetCh = gFilter.channel || '삼성화재';
      if (targetCh !== '전체' && targetCh !== 'all') {
        logs = logs.filter(c => {
          const ch = (c.channel || '').trim();
          if (targetCh.includes('삼성')) return ch.includes('삼성') || ch === '삼성화재';
          if (targetCh.includes('현대')) return ch.includes('현대') || ch === '현대해상';
          if (targetCh.includes('리본')) return ch.includes('리본') || ch === '리본케어';
          return ch.includes(targetCh) || targetCh.includes(ch);
        });
      }

      // 날짜 필터링 (시작일 ~ 종료일 범위 반영: 이번 주 등 선택 범위에 맞춰 동적 집계)
      if (gFilter.startDate || gFilter.endDate) {
        logs = logs.filter(c => {
          const dStr = (c.callTime || c.date || c.startedAt || '').slice(0, 10);
          if (!dStr) return true;
          if (gFilter.startDate && dStr < gFilter.startDate) return false;
          if (gFilter.endDate && dStr > gFilter.endDate) return false;
          return true;
        });
      }

      const cs = gReportData && gReportData.ctiSummary;
      const rInfo = (gReportData && gReportData.reportInfo) || {};
      const isChannelMatch = (targetCh === '전체' || targetCh === 'all')
        ? (rInfo.channel === 'all' || rInfo.channel === '전체' || !rInfo.channel)
        : (rInfo.channel && rInfo.channel.includes(targetCh));

      const isCtiRangeMatch = isChannelMatch &&
        (!gFilter.startDate || rInfo.startDate === gFilter.startDate) &&
        (!gFilter.endDate || rInfo.endDate === gFilter.endDate);

      // 1. 해당 기간의 총 인입콜 건수 (CTI 해당 기간 집계 또는 기간 필터링 합계)
      let totalCalls = 0;
      if (isCtiRangeMatch && cs && (cs.totalInbound !== undefined || cs.totalAll !== undefined)) {
        totalCalls = cs.totalInbound !== undefined ? cs.totalInbound : cs.totalAll;
      } else {
        // CTI 기간 매칭 전이거나 부분 기간 필터링인 경우:
        // 해당 기간에 속한 dailyTrends의 합계 또는 필터링된 콜 로그 건수 사용
        const periodTrends = (gReportData && gReportData.dailyTrends || []).filter(t => (!gFilter.startDate || t.date >= gFilter.startDate) && (!gFilter.endDate || t.date <= gFilter.endDate));
        const trendsSum = periodTrends.reduce((sum, t) => sum + (t.callCount || 0), 0);
        totalCalls = trendsSum > 0 ? trendsSum : logs.length;
      }

      let connectReqCalls = logs.length;

      let answeredCalls = 0;
      if (isCtiRangeMatch && cs && cs.answeredCalls !== undefined) {
        answeredCalls = cs.answeredCalls;
      } else {
        answeredCalls = logs.filter(c => c.duration && c.duration !== '0' && c.duration !== '00:00:00').length;
      }

      const consultedCalls = logs.filter(c => (c.title && c.title.trim()) || (c.summary && c.summary.trim()) || (c.category && c.category.trim()));
      const consultedCount = consultedCalls.length;

      const connectReqRate = totalCalls > 0 ? Math.round((connectReqCalls / totalCalls) * 100) : (connectReqCalls > 0 ? 100 : 0);
      let answerRate = '100%';
      if (isCtiRangeMatch && cs && cs.answerRate) {
        answerRate = cs.answerRate;
      } else if (connectReqCalls > 0) {
        answerRate = Math.round((answeredCalls / connectReqCalls) * 100) + '%';
      }
      const consultRate = answeredCalls > 0 ? Math.round((consultedCount / answeredCalls) * 100) : (consultedCount > 0 ? 100 : 0);

      let opDays = 1;
      if (gFilter.startDate && gFilter.endDate) {
        const d1 = new Date(gFilter.startDate);
        const d2 = new Date(gFilter.endDate);
        const diffTime = Math.abs(d2 - d1);
        opDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      } else if (filteredTrends.length > 0) {
        opDays = filteredTrends.length;
      } else {
        opDays = (gReportData && gReportData.reportInfo && gReportData.reportInfo.operatingDays) || 7;
      }
      if (opDays < 1) opDays = 1;

      const dailyAvg = Math.round(totalCalls / opDays);
      const dailyConsultAvg = Math.round(consultedCount / opDays);

      // 동적 카테고리 집계 (count > 0 항목만 추출)
      const catMap = {};
      const catDescMap = {};
      consultedCalls.forEach(c => {
        const catName = (c.category && c.category.trim()) || '기타/일반상담';
        catMap[catName] = (catMap[catName] || 0) + 1;
        if (c.summary && !catDescMap[catName]) {
          catDescMap[catName] = c.summary;
        }
      });

      const knownCatMeta = {};
      SAMSUNG_CATEGORIES.forEach(c => { knownCatMeta[c.name] = c; });

      const DEFAULT_PALETTES = [
        { color: 'sky', barClass: 'bg-sky-500', badgeClass: 'bg-sky-100 text-sky-800 border-sky-300' },
        { color: 'emerald', barClass: 'bg-emerald-500', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        { color: 'indigo', barClass: 'bg-indigo-500', badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
        { color: 'amber', barClass: 'bg-amber-500', badgeClass: 'bg-amber-100 text-amber-900 border-amber-300' },
        { color: 'teal', barClass: 'bg-teal-500', badgeClass: 'bg-teal-100 text-teal-800 border-teal-300' },
        { color: 'cyan', barClass: 'bg-cyan-500', badgeClass: 'bg-cyan-100 text-cyan-800 border-cyan-300' },
        { color: 'rose', barClass: 'bg-rose-500', badgeClass: 'bg-rose-100 text-rose-800 border-rose-300' },
        { color: 'purple', barClass: 'bg-purple-500', badgeClass: 'bg-purple-100 text-purple-800 border-purple-300' },
        { color: 'slate', barClass: 'bg-slate-500', badgeClass: 'bg-slate-100 text-slate-800 border-slate-300' }
      ];

      const catList = Object.keys(catMap).map((name, idx) => {
        const count = catMap[name];
        const share = consultedCount > 0 ? (count / consultedCount) : 0;
        const meta = knownCatMeta[name] || DEFAULT_PALETTES[idx % DEFAULT_PALETTES.length];
        const desc = (knownCatMeta[name] && knownCatMeta[name].description) || catDescMap[name] || '관련 문의 및 상담';
        return {
          name,
          count,
          share,
          pct: (share * 100).toFixed(1),
          description: desc,
          barClass: meta.barClass || 'bg-blue-500',
          badgeClass: meta.badgeClass || 'bg-slate-100 text-slate-800 border-slate-300'
        };
      }).sort((a, b) => b.count - a.count);

      // 동적 주체 집계 (count > 0 항목만 추출)
      const actorMap = {};
      consultedCalls.forEach(c => {
        const actName = (c.actor && c.actor.trim()) || '고객(가입자·이용자)';
        actorMap[actName] = (actorMap[actName] || 0) + 1;
      });

      const knownActorMeta = {};
      SAMSUNG_ACTORS.forEach(a => { knownActorMeta[a.name] = a; });

      const DEFAULT_ACTOR_PALETTES = [
        { color: 'blue', barClass: 'bg-blue-600', badgeClass: 'bg-blue-100 text-blue-800 border-blue-300', description: '실사용·가입 고객의 신청·접수 및 서비스 이해 문의' },
        { color: 'purple', barClass: 'bg-purple-600', badgeClass: 'bg-purple-100 text-purple-800 border-purple-300', description: '간병업체·협회의 파트너 등록·지역 연계 문의' },
        { color: 'emerald', barClass: 'bg-emerald-600', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', description: '요양보호사 등 간병 인력의 등록·자격 문의' },
        { color: 'amber', barClass: 'bg-amber-600', badgeClass: 'bg-amber-100 text-amber-900 border-amber-300', description: '삼성화재 판매채널(설계사·지점)의 상품설명·규정 확인' }
      ];

      const actorList = Object.keys(actorMap).map((name, idx) => {
        const count = actorMap[name];
        const share = consultedCount > 0 ? (count / consultedCount) : 0;
        const meta = knownActorMeta[name] || DEFAULT_ACTOR_PALETTES[idx % DEFAULT_ACTOR_PALETTES.length];
        const desc = (knownActorMeta[name] && knownActorMeta[name].description) || '관련 주체 문의';
        return {
          name,
          count,
          share,
          pct: (share * 100).toFixed(1),
          description: desc,
          barClass: meta.barClass || 'bg-indigo-600',
          badgeClass: meta.badgeClass || 'bg-slate-100 text-slate-800 border-slate-300'
        };
      }).sort((a, b) => b.count - a.count);

      return {
        totalCalls,
        connectReqCalls,
        answeredCalls,
        connectReqRate,
        connectRate: connectReqRate,
        answerRate,
        consultRate,
        consultedCount,
        opDays,
        dailyAvg,
        dailyConsultAvg,
        catList,
        actorList,
        logs
      };
    }

    function getFilteredDailyTrends(stats) {
      const logs = (stats && stats.logs) || [];
      const s = gFilter.startDate;
      const e = gFilter.endDate;
      const dailyMap = {};
      const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];

      if (s && e) {
        const cur = new Date(s);
        const end = new Date(e);
        while (cur <= end) {
          const ds = cur.toISOString().slice(0, 10);
          dailyMap[ds] = {
            date: ds,
            dayOfWeek: daysOfWeek[cur.getDay()],
            callCount: 0,
            note: cur.getDay() === 0 || cur.getDay() === 6 ? '주말' : ''
          };
          cur.setDate(cur.getDate() + 1);
        }
      }

      logs.forEach(c => {
        const d = (c.callTime || c.date || c.startedAt || '').slice(0, 10);
        if (d) {
          if (!dailyMap[d]) {
            const dow = daysOfWeek[new Date(d).getDay()] || '';
            dailyMap[d] = {
              date: d,
              dayOfWeek: dow,
              callCount: 0,
              note: dow === '토' || dow === '일' ? '주말' : ''
            };
          }
          dailyMap[d].callCount++;
        }
      });

      return Object.keys(dailyMap).sort().map(d => dailyMap[d]);
    }

    function renderDailyTrendChart() {
      const canvas = document.getElementById('samsungDailyTrendChart');
      if (!canvas || !gReportData) return;

      const stats = calculateStats();
      const trends = getFilteredDailyTrends(stats);
      const labels = trends.map(t => `${t.date.slice(5)} (${t.dayOfWeek})`);
      const data = trends.map(t => t.callCount);
      const backgroundColors = trends.map(t => {
        if (t.dayOfWeek === '토' || t.dayOfWeek === '일') return 'rgba(203, 213, 225, 0.8)';
        if (t.callCount >= 25) return 'rgba(29, 78, 216, 0.9)';
        return 'rgba(56, 189, 248, 0.85)';
      });

      if (gDailyChartInstance) {
        gDailyChartInstance.destroy();
      }

      const ctx = canvas.getContext('2d');
      gDailyChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '인입 콜 수 (건)',
            data,
            backgroundColor: backgroundColors,
            borderRadius: 6,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => `인입 콜: ${ctx.parsed.y}건`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            },
            x: {
              ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } }
            }
          }
        }
      });
    }

    function setPresetRange(type) {
      const today = new Date();
      const pad = n => String(n).padStart(2, '0');
      const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      let startStr = '';
      let endStr = '';

      gFilter.periodKey = type;

      if (type === 'today') {
        startStr = fmt(today);
        endStr = fmt(today);
      } else if (type === 'yesterday') {
        const y = new Date(today);
        y.setDate(today.getDate() - 1);
        startStr = fmt(y);
        endStr = fmt(y);
      } else if (type === 'thisWeek') {
        const range = getThisWeekRange();
        startStr = range.start;
        endStr = range.end;
      } else if (type === 'lastWeek') {
        const day = today.getDay();
        const diffToLastMonday = (day === 0 ? -6 : 1) - day - 7;
        const lastMon = new Date(today.getFullYear(), today.getMonth(), today.getDate() + diffToLastMonday);
        const lastSun = new Date(today.getFullYear(), today.getMonth(), today.getDate() + diffToLastMonday + 6);
        startStr = fmt(lastMon);
        endStr = fmt(lastSun);
      } else if (type === 'last30') {
        const past = new Date(today);
        past.setDate(today.getDate() - 30);
        startStr = fmt(past);
        endStr = fmt(today);
      }

      gFilter.startDate = startStr;
      gFilter.endDate = endStr;
      const sInput = document.getElementById('reportStartDate');
      const eInput = document.getElementById('reportEndDate');
      if (sInput) sInput.value = gFilter.startDate;
      if (eInput) eInput.value = gFilter.endDate;

      updatePresetButtons();
      applyDateRange(false);
    }

    async function applyDateRange(forceSync = false) {
      const s = document.getElementById('reportStartDate')?.value || gFilter.startDate;
      const e = document.getElementById('reportEndDate')?.value || gFilter.endDate;
      if (!s || !e) return;
      gFilter.startDate = s;
      gFilter.endDate = e;

      const thisWeek = getThisWeekRange();
      if (gFilter.startDate !== thisWeek.start || gFilter.endDate !== thisWeek.end) {
        if (gFilter.periodKey === 'thisWeek') gFilter.periodKey = '';
      }

      const url = new URL(window.location);
      url.searchParams.set('start', s);
      url.searchParams.set('end', e);
      url.searchParams.set('channel', gFilter.channel);
      window.history.replaceState({}, '', url);

      updatePresetButtons();
      updateBranding();

      const rInfo = (gReportData && gReportData.reportInfo) || {};
      const isSameRange = rInfo.startDate === s && rInfo.endDate === e && (
        (gFilter.channel === '전체' || gFilter.channel === 'all') ? (rInfo.channel === 'all' || rInfo.channel === '전체') : ((rInfo.channel || '').includes(gFilter.channel))
      );

      const hasData = gReportData && Array.isArray(gReportData.callLogs) && gReportData.callLogs.length > 0;

      // 1. 이미 데이터가 메모리에 로드되어 있다면 0ms 즉각 화면 렌더링
      if (hasData) {
        renderAll();
        // 이미 해당 기간 데이터와 일치하고 강제 새로고침이 아니면 즉시 완료
        if (!forceSync && isSameRange) return;
      }

      await syncLiveCti();
    }

    function setSyncBtnLoading(loading) {
      const btn = document.getElementById('syncCtiBtn');
      const textEl = document.getElementById('syncCtiBtnText');
      if (loading) {
        if (btn) btn.classList.add('opacity-75', 'pointer-events-none');
        if (textEl) textEl.innerText = '새로고침 중...';
        const icons = btn ? btn.querySelectorAll('[data-lucide="refresh-cw"], svg, #syncIcon') : [document.getElementById('syncIcon')];
        icons.forEach(ic => ic && ic.classList.add('animate-spin'));
      } else {
        if (btn) {
          btn.classList.remove('opacity-75', 'pointer-events-none');
          btn.querySelectorAll('.animate-spin').forEach(ic => ic.classList.remove('animate-spin'));
        }
        if (textEl) textEl.innerText = '새로고침';
        const ic = document.getElementById('syncIcon');
        if (ic) ic.classList.remove('animate-spin');
      }
    }

    async function syncLiveCti() {
      if (isSyncing) return;
      isSyncing = true;
      setSyncBtnLoading(true);

      const ch = document.getElementById('reportChannelSelect')?.value || gFilter.channel || '삼성화재';
      gFilter.channel = ch;
      updateBranding();

      try {
        let synced = false;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        try {
          const res = await fetch(`/api/samsung/call-report/sync-cti?start=${gFilter.startDate}&end=${gFilter.endDate}&channel=${encodeURIComponent(ch)}`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          if (res.ok) {
            const cType = res.headers.get('content-type') || '';
            if (cType.includes('json')) {
              const json = await res.json();
              if (json.success && json.data) {
                gReportData = json.data;
                synced = true;
              }
            }
          }
        } catch (e) {
          clearTimeout(timeoutId);
        }

        if (!synced) {
          const isHyundai = ch.includes('현대');
          const fallbacks = isHyundai ? [
            `/call_report_all.json?t=${Date.now()}`,
            `./call_report_all.json?t=${Date.now()}`,
            `call_report_all.json?t=${Date.now()}`,
            `/api/samsung/call-report/data?channel=${encodeURIComponent(ch)}`
          ] : [
            `/call_report_samsung.json?t=${Date.now()}`,
            `./call_report_samsung.json?t=${Date.now()}`,
            `call_report_samsung.json?t=${Date.now()}`,
            `/call_report_all.json?t=${Date.now()}`,
            `/api/samsung/call-report/data?channel=${encodeURIComponent(ch)}`
          ];
          for (const u of fallbacks) {
            try {
              const sRes = await fetch(u);
              if (sRes.ok) {
                const sType = sRes.headers.get('content-type') || '';
                if (sType.includes('json') || !sType.includes('html')) {
                  const sJson = await sRes.json();
                  const data = (sJson && sJson.data) ? sJson.data : sJson;
                  if (data && data.callLogs) {
                    gReportData = data;
                    synced = true;
                    break;
                  }
                }
              }
            } catch (e) {}
          }
        }

        if (gReportData) {
          try {
            const cacheKey = ch.includes('현대') ? 'LIVON_CACHED_ALL_REPORT_DATA' : 'LIVON_CACHED_SAMSUNG_REPORT_DATA';
            sessionStorage.setItem(cacheKey, JSON.stringify(gReportData));
          } catch (e) {}
        }

        updateBranding();
        const viewerSyncedAt = document.getElementById('viewerSyncedAt');
        if (viewerSyncedAt) viewerSyncedAt.innerText = `CTI 동기화: ${new Date().toLocaleTimeString('ko-KR')}`;
        setSyncBtnLoading(false);
        renderAll();
      } catch (err) {
        console.error('Sync error:', err);
        setSyncBtnLoading(false);
        renderAll();
      } finally {
        isSyncing = false;
        setSyncBtnLoading(false);
      }
    }

          type: c.type || 'IN',
          channel: c.channel || '삼성화재',
          callTime: c.callTime || '',
          memberName: resolvedName,
          phone: formattedPhone,
          arsMenu: c.arsMenu || '',
          connectReq: c.connectReq || '',
          waitTime: c.waitTime || 0,
          category: c.category || '',
          actor: c.actor || '',
          title: c.title || '',
          summary: c.summary || '',
          keywords: c.keywords || '',
          duration: c.duration || '0'

        r.eachCell(cell => {
          cell.border = thinBorder;
          cell.alignment = { vertical: 'middle' };
          cell.font = { name: '맑은 고딕', size: 10 };

        if (idx % 2 === 1) {
          r.eachCell((cell, col) => {
            if (col !== 9 && col !== 10) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          });
        }

        if (c.category) {
          r.getCell('category').font = { name: '맑은 고딕', size: 10, bold: true, color: { argb: 'FF0369A1' } };
          r.getCell('category').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0F2FE' } };

        if (c.actor) {
          r.getCell('actor').font = { name: '맑은 고딕', size: 10, bold: true, color: { argb: 'FF4338CA' } };
          r.getCell('actor').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0E7FF' } };
        }

        // 상담제목, 상담요약, 키워드 열 자동 줄바꿈(wrapText) 설정 및 행 높이 자동 조절

        const sumLen = (c.summary || '').length;

        const kwLen = (c.keywords || '').length;
        const maxLen = Math.max(sumLen, titleLen, kwLen);
        if (maxLen > 100) {
          r.height = 48;
        } else if (maxLen > 45) {
          r.height = 34;
        } else {
          r.height = 24;
        }
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const chLabel = gReportData.reportInfo.channelLabel || gFilter.channel || '삼성화재';
      a.download = `${chLabel}_간병콜분석_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function setPdfProgress(stepText, percent) {
      const modal = document.getElementById('pdfProgressModal');
      if (!modal) return;
      modal.classList.remove('hidden');
      const bar = document.getElementById('pdfProgressBar');
      if (bar) bar.style.width = `${percent}%`;
      const stepEl = document.getElementById('pdfProgressStepText');
      if (stepEl) stepEl.innerText = stepText;
      const pctEl = document.getElementById('pdfProgressPercent');
      if (pctEl) pctEl.innerText = `${percent}%`;
    }

    function hidePdfProgress() {
      const modal = document.getElementById('pdfProgressModal');
      if (modal) {
        setTimeout(() => modal.classList.add('hidden'), 600);
      }
    }

                  <td style="vertical-align: top; font-weight: bold; color: #1e40af;">${c.category}</td>
                  <td style="vertical-align: top; font-weight: bold; color: #4338ca;">${c.actor}</td>
                  <td style="vertical-align: top; font-weight: bold; color: #0f172a; line-height: 1.3;">${c.title}</td>
                  <td style="vertical-align: top; font-size: 7pt; color: #334155; line-height: 1.4; word-break: break-all;"><div style="-webkit-line-clamp: 3; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;">${c.summary}</div></td>
                </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </body>
        </html>
      `;

        setPdfProgress('3/4 서버 PDF 고화질 렌더링 중...', 80);
        const res = await fetch('/api/samsung/call-report/pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            htmlContent: html,
            title: `${compName}_간병서비스_콜분석_${info.period || '보고서'}`
          })
        });

        if (!res.ok) throw new Error('PDF 생성 서버 에러');
        setPdfProgress('4/4 PDF 파일 다운로드 중...', 95);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${compName}_간병서비스_콜분석_보고서.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setPdfProgress('완료되었습니다!', 100);
      } catch (e) {
        alert('PDF 다운로드 실패: ' + e.message);
      } finally {
        hidePdfProgress();
      }
    }

    /**
     * 웹 뷰어용 상담요약 복사 함수
     */
    function copyViewerSummaryText(btn, text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        if (btn) {
          const origHtml = btn.innerHTML;
          btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i>';
          btn.classList.add('bg-emerald-50', 'border-emerald-300');
          if (window.lucide) lucide.createIcons();
          setTimeout(() => {
            btn.innerHTML = origHtml;
            btn.classList.remove('bg-emerald-50', 'border-emerald-300');
            if (window.lucide) lucide.createIcons();
          }, 1500);
        }
      }).catch(() => {
        prompt('아래 상담요약 내용을 복사하세요:', text);
      });
    }
  </script>

  <!-- PDF 다운로드 진행 상태 모달 -->

      <h3 class="text-base font-bold text-slate-800 mb-1">고화질 PDF 보고서 생성 중</h3>
      <p id="pdfProgressStepText" class="text-xs text-slate-500 mb-4">보고서 데이터 집계 중...</p>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden mb-2">

      <div class="flex justify-between items-center text-[11px] text-slate-400 font-mono">
