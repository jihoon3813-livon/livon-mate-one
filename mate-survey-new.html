<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>리본케어 간병사 전용 앱 · 안심 일지 & 만족도 설문</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f6eff5;
      color: #2b1938;
      -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      box-shadow: 0 12px 36px rgba(43, 25, 56, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .livon-header {
      background: linear-gradient(155deg, #2b1838 0%, #4a1c44 55%, #be185d 100%);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 리본케어 로즈·플럼 앱 상단바 -->
    <header class="livon-header text-white px-5 py-4 flex items-center justify-between sticky top-0 z-20 shadow-md">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-white/15 border border-pink-300/30 flex items-center justify-center font-black text-base text-pink-200">
          Liv
        </div>
        <div>
          <span class="text-[10px] font-extrabold text-pink-300 block tracking-widest uppercase">LIVON CARE PARTNER</span>
          <h1 class="text-base font-extrabold leading-tight">리본케어 안심일지 & 설문 안내</h1>
        </div>
      </div>
      <span class="px-2.5 py-1 rounded-full bg-pink-500/25 border border-pink-300/30 text-[11px] font-bold text-pink-100">
        간병인 전용 앱뷰
      </span>
    </header>

    <main class="flex-1 p-5 space-y-4 overflow-y-auto pb-24">
      <!-- 안내 배너 -->
      <div class="bg-gradient-to-br from-pink-50 via-rose-50 to-amber-50 border border-pink-200 rounded-2xl p-4 shadow-sm">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-xl bg-rose-600 text-white flex items-center justify-center shrink-0 mt-0.5 shadow-sm">
            <i class="fa-solid fa-book-medical text-base"></i>
          </div>
          <div>
            <h2 class="text-sm font-extrabold text-slate-900 mb-1">모바일 간병일지 + 만족도 설문 (커피쿠폰 증정)</h2>
            <p class="text-xs text-slate-600 leading-relaxed">
              환자·보호자분께 <b>모바일 간병일지</b>와 <b>만족도 조사(스타벅스 커피쿠폰 증정)</b>가 결합된 통합 페이지를 안내해 주세요.
            </p>
          </div>
        </div>
      </div>

      <!-- 배정 정보 카드 -->
      <div class="bg-white border border-pink-100 rounded-2xl p-5 shadow-sm">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
          <span class="text-xs font-extrabold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200">
            현재 담당 환자
          </span>
          <span id="mateServiceId" class="text-xs font-mono text-slate-400">SV-0000</span>
        </div>
        <div class="space-y-2.5 text-sm">
          <div class="flex justify-between">
            <span class="text-slate-400 font-semibold">환자 성명</span>
            <span id="matePatientName" class="font-extrabold text-slate-800">-</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400 font-semibold">입원 병원</span>
            <span id="mateHospital" class="font-bold text-slate-700">-</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400 font-semibold">간병 기간</span>
            <span id="matePeriod" class="font-bold text-slate-700">-</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400 font-semibold">담당 간병사</span>
            <span id="mateCaregiver" class="font-extrabold text-rose-700">-</span>
          </div>
        </div>
      </div>

      <!-- QR 코드 및 직접 열기 -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-center">
        <span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-[11px] font-extrabold mb-2">
          ☕ 설문 참여 시 스타벅스 커피쿠폰 100% 증정
        </span>
        <h3 class="text-base font-extrabold text-slate-800 mb-1">보호자·환자 스캔용 통합 QR 코드</h3>
        <p class="text-xs text-slate-500 mb-4">스마트폰 카메라로 스캔하면 모바일 간병일지와 설문이 바로 열립니다.</p>
        <div id="mateQrBox" class="w-44 h-44 mx-auto bg-white p-3 rounded-2xl border border-pink-200 shadow-sm flex items-center justify-center mb-4"></div>

        <div class="grid grid-cols-1 gap-2.5">
          <button type="button" onclick="openIntegratedPage()" class="w-full py-3.5 px-4 rounded-xl text-white font-extrabold text-sm shadow-md flex items-center justify-center gap-2" style="background: linear-gradient(135deg, #db2777 0%, #be185d 100%);">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span>일지 + 만족도 설문 통합 페이지 열기</span>
          </button>
          <button type="button" onclick="copyIntegratedLink()" class="w-full py-3 px-4 rounded-xl bg-white border border-pink-300 text-rose-700 font-extrabold text-xs flex items-center justify-center gap-2 hover:bg-pink-50">
            <i class="fa-solid fa-copy"></i>
            <span>환자/보호자 발송용 안내문자 + 링크 복사</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    let gIntegratedUrl = '';
    let gPatientName = '고연분';

    async function initMateSurveyNew() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || params.get('t') || '';
      const targetId = params.get('targetId') || '';

      let info = null;
      try {
        const raw = localStorage.getItem('LIVON_SURVEY_TARGETS');
        if (raw) {
          const list = JSON.parse(raw);
          info = list.find(t => (token && t.token === token) || (targetId && (t.id === targetId || t.serviceId === targetId))) || list[0];
        }
      } catch (e) {}

      if (token) {
        try {
          const res = await fetch(`/api/public/survey/form?token=${encodeURIComponent(token)}`);
          const data = await res.json();
          if (data && data.valid && data.serviceInfo) {
            info = { ...(info || {}), ...data.serviceInfo, token };
          }
        } catch (e) {}
      }

      if (info) {
        gPatientName = info.patientName || '고연분';
        document.getElementById('mateServiceId').textContent = info.serviceId || info.id || 'SV-2026';
        document.getElementById('matePatientName').textContent = (info.patientName || '고연분') + ' 님';
        document.getElementById('mateHospital').textContent = info.hospitalName || '지정 병원';
        document.getElementById('matePeriod').textContent = `${info.careStartDate || '-'} ~ ${info.careEndDate || '-'}`;
        document.getElementById('mateCaregiver').textContent = (info.caregiverName || '권은지') + ' 간병사';
      }

      const q = new URLSearchParams();
      if (token || (info && info.token)) q.set('t', token || info.token);
      if (info && info.id) q.set('targetId', info.id);
      if (info && info.patientName) q.set('patient', info.patientName);
      if (info && info.caregiverName) q.set('carer', info.caregiverName);
      if (info && info.hospitalName) q.set('hospital', info.hospitalName);

      gIntegratedUrl = `${window.location.origin}/survey-care-diary.html?${q.toString()}`;

      const qrBox = document.getElementById('mateQrBox');
      if (qrBox && typeof QRCode !== 'undefined') {
        qrBox.innerHTML = '';
        new QRCode(qrBox, {
          text: gIntegratedUrl,
          width: 150,
          height: 150,
          colorDark: '#2b1938',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    function openIntegratedPage() {
      if (gIntegratedUrl) window.open(gIntegratedUrl, '_blank');
    }

    function copyIntegratedLink() {
      const msg = `[리본케어] ${gPatientName} 님의 모바일 간병일지 & 케어 만족도 설문이 도착했습니다.\n\n간병일지를 확인하시고 하단 만족도 조사에 응답해 주시면 모바일 커피쿠폰을 보내드립니다.\n${gIntegratedUrl}`;
      navigator.clipboard.writeText(msg).then(() => {
        alert('✅ 안내 문자와 통합 링크가 복사되었습니다.');
      });
    }

    window.addEventListener('DOMContentLoaded', initMateSurveyNew);
  </script>
</body>
</html>
